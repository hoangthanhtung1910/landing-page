name: CI
on: [push, pull_request]
defaults:
  run:
    working-directory: korean-shopping-proxy
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.4 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm, cache-dependency-path: korean-shopping-proxy/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm --filter @vyvy/content-types build && pnpm --filter api build && pnpm --filter admin build
      - run: pnpm --filter web test
      - run: RUN_MONGO_TESTS=1 pnpm --filter api test
        env:
          MONGO_URI: mongodb://127.0.0.1:27017/vyvy_ci
          SESSION_SECRET: ci-session-secret-value
          CORS_ORIGINS: http://localhost:3000,http://localhost:3001
          SEED_ADMIN_PASSWORD: ci-admin-password-value
      - run: pnpm audit --audit-level high
